<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="55%" stop-color="#111C2E" />
      <stop offset="100%" stop-color="#162032" />
    </linearGradient>
    <linearGradient id="accentBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="55%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <linearGradient id="stripGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="tileGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A5F" />
      <stop offset="100%" stop-color="#0F1B2E" />
    </linearGradient>
  </defs>

  <!-- Outer rounded squircle container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#accentBorder)" stroke-width="18" />

  <!-- Subtle inner bevel -->
  <rect x="52" y="52" width="408" height="408" rx="84" fill="none" stroke="#1E293B" stroke-width="3" />

  <!-- 2x3 Left/Center LCD Keys forming the body of "D" -->
  <!-- Row 0 -->
  <rect x="104" y="108" width="84" height="84" rx="20" fill="url(#tileGlow)" stroke="#22D3EE" stroke-width="6" />
  <circle cx="146" cy="150" r="18" fill="none" stroke="#22D3EE" stroke-width="6" stroke-dasharray="78 36" stroke-linecap="round" />

  <rect x="206" y="108" width="84" height="84" rx="20" fill="url(#tileGlow)" stroke="#38BDF8" stroke-width="6" />
  <path d="M226 164 L240 144 L252 154 L270 130" fill="none" stroke="#22C55E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Row 1 -->
  <rect x="104" y="210" width="84" height="84" rx="20" fill="url(#tileGlow)" stroke="#38BDF8" stroke-width="6" />
  <rect x="126" y="244" width="40" height="16" rx="8" fill="#22D3EE" />

  <rect x="206" y="210" width="84" height="84" rx="20" fill="#13233A" stroke="#22D3EE" stroke-width="6" />
  <circle cx="248" cy="252" r="15" fill="#22C55E" />

  <!-- Row 2 -->
  <rect x="104" y="312" width="84" height="84" rx="20" fill="url(#tileGlow)" stroke="#22D3EE" stroke-width="6" />
  <path d="M126 364 L166 364" fill="none" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" />
  <path d="M126 346 L152 346" fill="none" stroke="#22C55E" stroke-width="7" stroke-linecap="round" />

  <rect x="206" y="312" width="84" height="84" rx="20" fill="url(#tileGlow)" stroke="#38BDF8" stroke-width="6" />
  <path d="M238 338 L262 354 L238 370 Z" fill="#22D3EE" />

  <!-- Right Vertical Telemetry Strip curving to close the "D" silhouette -->
  <path d="M 314 108 H 346 C 386 108 408 134 408 176 V 328 C 408 370 386 396 346 396 H 314 A 18 18 0 0 1 296 378 V 126 A 18 18 0 0 1 314 108 Z"
        fill="#102136" stroke="url(#stripGrad)" stroke-width="8" />

  <!-- Mini widgets inside the vertical strip -->
  <rect x="322" y="138" width="58" height="22" rx="6" fill="#22D3EE" />
  <circle cx="351" cy="252" r="22" fill="none" stroke="#22C55E" stroke-width="7" />
  <circle cx="351" cy="252" r="8" fill="#22C55E" />
  <rect x="322" y="336" width="58" height="24" rx="7" fill="#38BDF8" opacity="0.9" />
</svg>
